# Illustrative shift-left pipeline — see pipeline-design.md for the reasoning behind every gate.
# Designed for a self-managed GitLab instance with group + project runners (matches the current estate).

stages:
  - secrets-scan
  - iac-scan
  - supply-chain-scan
  - policy-check
  - plan
  - approval
  - apply
  - post-pipeline

default:
  tags:
    - group-managed          # Module 2: ephemeral, group-managed runners only — no project-level runner builds a release artefact

variables:
  WORKLOAD_TIER: "B"          # Overridden per-project: A | B | C, see pipeline-design.md tiering model
  TF_ROOT: "${CI_PROJECT_DIR}"
  AWS_ROLE_ARN: "arn:aws:iam::ACCOUNT_ID:role/${CI_PROJECT_NAME}-ci-pipeline-role"  # per-workload aws_iam_role.ci_pipeline, tag-scoped (Module 3 / iam-scoped-policy.tf)

# ---------------------------------------------------------------------------
# OIDC federation — replaces the wildcard-permission static access key finding (F-11/F-18) directly.
# GitLab's native ID token is exchanged for a short-lived AWS credential via
# sts:AssumeRoleWithWebIdentity, scoped to this project/protected-branch's `sub` claim
# (see the assume_role_policy Condition in ../07-remediation/fixed-terraform/iam-scoped-policy.tf).
# No AWS credential is ever stored as a CI/CD variable; nothing here outlives the job.
# ---------------------------------------------------------------------------
id_tokens:
  AWS_ID_TOKEN:
    aud: https://gitlab.example-gov-programme.internal

.federated_aws_auth: &federated_aws_auth |
  CREDS=$(aws sts assume-role-with-web-identity \
    --role-arn "${AWS_ROLE_ARN}" \
    --role-session-name "gitlab-${CI_PIPELINE_ID}" \
    --web-identity-token "${AWS_ID_TOKEN}" \
    --duration-seconds 900 --output json)
  export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)
  export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)
  export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)

# ---------------------------------------------------------------------------
# 1. Secrets scan — hard-fail always, every tier. No exception waives a live credential.
# ---------------------------------------------------------------------------
secrets:gitleaks:
  stage: secrets-scan
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 2. IaC misconfiguration — Checkov as primary, tfsec as a cross-check.
#    Critical severity hard-fails on every tier; High/Medium behaviour depends on tier.
# ---------------------------------------------------------------------------
iac:checkov:
  stage: iac-scan
  image: bridgecrew/checkov:3.3.6
  script:
    - checkov -d ${TF_ROOT} --compact --output json --output-file-path checkov-results.json
    - |
      # Hard-fail only on Critical-mapped checks (see severity-methodology.md rating factors);
      # everything else is written to the artefact for the findings backlog, not blocked here.
      python3 ci/enforce_severity.py --input checkov-results.json --tier "$WORKLOAD_TIER" --hard-fail-on critical
  artifacts:
    paths:
      - checkov-results.json
    when: always
  allow_failure: false

iac:tfsec-crosscheck:
  stage: iac-scan
  image: aquasec/tfsec:latest
  script:
    - tfsec ${TF_ROOT} --format json --out tfsec-results.json
  artifacts:
    paths:
      - tfsec-results.json
    when: always
  allow_failure: true   # soft-fail: cross-check only, Checkov is the enforced source of truth

# ---------------------------------------------------------------------------
# 3. Software supply chain — Trivy for dependency/container CVEs + SBOM generation.
# ---------------------------------------------------------------------------
supply-chain:trivy:
  stage: supply-chain-scan
  image: aquasec/trivy:latest
  script:
    - trivy fs --format cyclonedx --output sbom.cdx.json .
    - trivy fs --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed .
  artifacts:
    paths:
      - sbom.cdx.json
    when: always
  allow_failure: false   # Critical/High with an available fix hard-fails; unfixed CVEs are tracked (--ignore-unfixed), not blocked

# ---------------------------------------------------------------------------
# 4. Policy-as-code — org-specific rules expressed once, evaluated identically across providers.
# ---------------------------------------------------------------------------
policy:opa-conftest:
  stage: policy-check
  image: openpolicyagent/conftest:latest
  script:
    - conftest test --policy ci/policy/ ${TF_ROOT} --output json > conftest-results.json
  artifacts:
    paths:
      - conftest-results.json
    when: always
  allow_failure: false

# ---------------------------------------------------------------------------
# 5. Plan — only runs once every scan gate above has produced a result.
# ---------------------------------------------------------------------------
plan:terraform:
  stage: plan
  image: hashicorp/terraform:1.9
  before_script:
    - *federated_aws_auth
  script:
    - terraform -chdir=${TF_ROOT} init -backend=true
    - terraform -chdir=${TF_ROOT} validate
    - terraform -chdir=${TF_ROOT} plan -out=tfplan
  artifacts:
    paths:
      - "${TF_ROOT}/tfplan"
  needs:
    - iac:checkov
    - supply-chain:trivy
    - policy:opa-conftest

# ---------------------------------------------------------------------------
# 6. Protected-environment approval — human security sign-off before production apply.
#    Only runs for Tier A/B; Tier C (COTS/legacy exceptions) still requires it for go-live,
#    with the exception list from Module 8 attached as evidence in the approval, not silently passed.
# ---------------------------------------------------------------------------
security-signoff:
  stage: approval
  image: alpine:latest
  script:
    - echo "Manual gate — requires a named approver from the security review group before apply proceeds."
  environment:
    name: production
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false

apply:terraform:
  stage: apply
  image: hashicorp/terraform:1.9
  before_script:
    - *federated_aws_auth
  script:
    - terraform -chdir=${TF_ROOT} apply -auto-approve tfplan
  environment:
    name: production
  needs:
    - plan:terraform
    - security-signoff
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Post-pipeline — feed scan results + SBOM diffs into the same findings register schema as
# Module 1, tagged source: pipeline, so supply-chain/IaC risk isn't tracked in a separate
# spreadsheet from the manual review findings. Runs even when an earlier gate soft-failed,
# so warn-only findings still reach the backlog (see "Hard-fail vs soft-fail" in pipeline-design.md).
# ---------------------------------------------------------------------------
post-pipeline:publish-findings:
  stage: post-pipeline
  image: alpine:latest
  rules:
    - when: always
  needs:
    - job: iac:checkov
      artifacts: true
    - job: iac:tfsec-crosscheck
      artifacts: true
    - job: supply-chain:trivy
      artifacts: true
    - job: policy:opa-conftest
      artifacts: true
      optional: true
  script:
    - echo "Publishing checkov-results.json, tfsec-results.json, sbom.cdx.json, conftest-results.json to the findings register (source: pipeline) and SIEM ingestion (06-detection-ir/monitoring-ir-plan.md)"
    # In a real environment this posts to the same schema/endpoint 01-findings/findings-register.md and the
    # SIEM both read from — left as a described integration point rather than a fake API call here.
